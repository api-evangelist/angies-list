aid: angies-list
name: Angie’s List
description: >-
  Angie’s List is a consumer marketplace for finding, reviewing, and hiring local
  home-service professionals — plumbers, electricians, roofers, landscapers, house
  cleaners, and hundreds of other trades. Founded in 1995 by Angie Hicks and William
  Oesterle, it pioneered member-submitted, verified reviews and letter-grade ratings
  of service providers across U.S. metro markets. In 2017 Angie’s List merged with
  HomeAdvisor to form ANGI Homeservices (now Angi Inc., NASDAQ: ANGI, part of IAC),
  and in 2021 the consumer brand and website were rebranded from angieslist.com to
  angi.com. Angi is a consumer/pro home-services platform and does not currently
  publish a public developer API program; this API Evangelist profile tracks its
  public web and security surface. Surfaced as a portfolio company of Battery Ventures.
